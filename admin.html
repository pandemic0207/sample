<!-- 2026-11-28 rev.1 — 관리자 페이지 admin.html 처음 만듦: 잠금 화면(관리자 비밀번호) → 신청자 목록(최근 신청이 맨 위 · 총 신청 인원) · 줄마다 [수정] [삭제] · 수정 팝업 · 삭제 확인 팝업. 비밀번호 확인은 매번 서버(functions/api/admin.js)에서, 로그인은 브라우저 탭을 닫을 때까지 유지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- 검색 사이트에 관리자 페이지가 나오지 않게 -->
<title>신청자 관리 — 호서대학교 × 일잘러랩 AI 특강</title>
<style>
  :root {
    /* 색상: 신청 페이지(index.html)와 같은 남색 + 보라색 */
    --bg: #07061a;
    --bg-alt: #0d0b24;
    --card: #14112e;
    --line: rgba(167, 145, 255, 0.18);
    --text: #f3f1ff;
    --muted: #aba6cd;
    --accent: #7c5cff;
    --accent-soft: #b4a2ff;
    --error: #ff8fa3;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(70% 40% at 50% 0%, rgba(124, 92, 255, 0.22), transparent 70%), var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { margin: 0; line-height: 1.3; letter-spacing: -0.02em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .msg-error { margin: 8px 0 0; color: var(--error); font-size: 0.92rem; }
  .msg-error:empty { display: none; }

  /* 버튼 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 0 28px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #9077ff, #6a48f5);
    color: #fff;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 10px 28px rgba(124, 92, 255, 0.4);
  }
  .btn:focus-visible, .btn-row:focus-visible { outline: 3px solid #d4c8ff; outline-offset: 3px; }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn-ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn-danger { background: linear-gradient(180deg, #e0557c, #a8264c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 10px 28px rgba(168, 38, 76, 0.4); }

  /* 입력 칸 */
  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; font-size: 0.95rem; font-weight: 600; }
  .req { color: var(--accent-soft); font-size: 0.85rem; }
  .field input {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 1px solid rgba(167, 145, 255, 0.28);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 16px; /* 16px보다 작으면 아이폰에서 화면이 확대됨 */
  }
  .field input:focus { outline: none; border-color: var(--accent-soft); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.35); }
  .field input[aria-invalid="true"] { border-color: var(--error); }
  .field .msg-error { margin-top: 6px; font-size: 0.88rem; }

  /* [잠금 화면] */
  .lock { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 24px 20px; }
  .lock-card {
    width: min(400px, 100%);
    padding: 36px 28px 28px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }
  .lock-card h1 { font-size: 1.6rem; }
  .lock-card .sub { margin-bottom: 28px; }
  .lock-card .btn { width: 100%; margin-top: 8px; }

  /* [목록 화면] */
  .wrap { width: min(1200px, 100% - 32px); margin-inline: auto; padding: 32px 0 64px; }
  .list-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .list-head h1 { font-size: clamp(1.5rem, 5vw, 2rem); }
  .total {
    margin: 0;
    padding: 10px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .total b { margin: 0 2px 0 6px; color: var(--text); font-size: 1.8rem; font-weight: 800; line-height: 1; }
  #list-error { margin: 0 0 12px; }

  /* 신청자 표: 휴대폰에서는 옆으로 밀어서 보기, [수정] [삭제] 칸은 오른쪽에 고정 */
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
  .applicants { width: 100%; min-width: 920px; border-collapse: collapse; font-size: 0.95rem; }
  .applicants th {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: #1a1638;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
  }
  .applicants td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .applicants tbody tr:last-child td { border-bottom: 0; }
  .applicants .num, .applicants .time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .applicants .phone { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .applicants .name, .applicants .org, .applicants .job { min-width: 84px; }
  .applicants .email { min-width: 220px; max-width: 300px; overflow-wrap: anywhere; }
  .applicants th:last-child, .applicants .actions {
    position: sticky;
    right: 0;
    background: var(--card);
    box-shadow: -12px 0 12px -12px rgba(0, 0, 0, 0.6);
    text-align: right;
    white-space: nowrap;
  }
  .applicants th:last-child { background: #1a1638; }
  .applicants .empty { padding: 48px 16px; color: var(--muted); text-align: center; }
  .btn-row {
    min-height: 36px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-row:hover { background: rgba(255, 255, 255, 0.06); }
  .btn-row + .btn-row { margin-left: 6px; }
  .btn-row-danger { border-color: rgba(255, 143, 163, 0.4); color: var(--error); }

  /* [팝업] 수정 · 삭제 확인 */
  body:has(.modal[open]) { overflow: hidden; }
  .modal {
    width: min(440px, 100% - 32px);
    max-height: calc(100% - 32px);
    margin: auto;
    padding: 28px 24px 24px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
    color: var(--text);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), 0 0 60px rgba(124, 92, 255, 0.18);
    overflow-y: auto;
  }
  .modal::backdrop { background: rgba(4, 3, 15, 0.78); }
  .modal h2 { font-size: 1.25rem; }
  .modal-meta { margin: 6px 0 20px; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .modal .form-error { margin: 0 0 12px; text-align: center; }

  /* 휴대폰: 오른쪽에 고정된 [수정] [삭제] 칸을 조금 좁게 */
  @media (max-width: 759px) {
    .applicants .actions { padding: 10px 10px 10px 12px; }
    .btn-row { padding: 0 11px; }
    .btn-row + .btn-row { margin-left: 4px; }
  }
  @media (min-width: 760px) {
    .wrap { padding: 48px 0 80px; }
  }
</style>
</head>
<body>

<!-- [잠금 화면] 관리자 비밀번호 입력칸만 보임 -->
<main class="lock" id="lock-view">
  <form class="lock-card" id="lock-form" novalidate>
    <h1>신청자 관리</h1>
    <p class="sub">호서대학교 × 일잘러랩 AI 특강</p>
    <div class="field">
      <label for="admin-password">관리자 비밀번호</label>
      <input id="admin-password" type="password" autocomplete="current-password" aria-describedby="lock-error">
      <p class="msg-error" id="lock-error" role="alert"></p>
    </div>
    <button type="submit" class="btn" id="lock-submit">들어가기</button>
  </form>
</main>

<!-- [목록 화면] 신청자 목록 (비밀번호가 맞을 때만 보임) -->
<main id="list-view" hidden>
  <div class="wrap">
    <header class="list-head">
      <div>
        <h1>신청자 관리</h1>
        <p class="sub">호서대학교 × 일잘러랩 AI 특강</p>
      </div>
      <p class="total">총 신청 인원<b id="total-count">0</b>명</p>
    </header>
    <p class="msg-error" id="list-error" role="alert"></p>
    <div class="table-scroll">
      <table class="applicants">
        <thead>
          <tr>
            <th>신청 번호</th>
            <th>신청 시간</th>
            <th>이름</th>
            <th>소속</th>
            <th>직위</th>
            <th>연락처</th>
            <th>이메일</th>
            <th><span class="sr-only">수정 · 삭제</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- [팝업] 수정: 이름 · 소속 · 직위 · 연락처 · 이메일 고치고 저장 -->
<dialog class="modal" id="edit-dialog" aria-labelledby="edit-title">
  <form id="edit-form" novalidate>
    <h2 id="edit-title">신청자 정보 수정</h2>
    <p class="modal-meta" id="edit-meta"></p>
    <div class="field">
      <label for="e-name">이름 <span class="req">(필수)</span></label>
      <input id="e-name" name="name" type="text" maxlength="50" autocomplete="off" aria-describedby="err-name">
      <p class="msg-error" id="err-name"></p>
    </div>
    <div class="field">
      <label for="e-organization">소속</label>
      <input id="e-organization" name="organization" type="text" maxlength="100" autocomplete="off">
    </div>
    <div class="field">
      <label for="e-job_title">직위</label>
      <input id="e-job_title" name="job_title" type="text" maxlength="50" autocomplete="off">
    </div>
    <div class="field">
      <label for="e-phone">연락처 <span class="req">(필수)</span></label>
      <input id="e-phone" name="phone" type="tel" inputmode="tel" maxlength="30" autocomplete="off" aria-describedby="err-phone">
      <p class="msg-error" id="err-phone"></p>
    </div>
    <div class="field">
      <label for="e-email">이메일 <span class="req">(필수)</span></label>
      <input id="e-email" name="email" type="email" inputmode="email" maxlength="254" autocomplete="off" aria-describedby="err-email">
      <p class="msg-error" id="err-email"></p>
    </div>
    <p class="msg-error form-error" id="edit-error" role="alert"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="edit-cancel">취소</button>
      <button type="submit" class="btn" id="edit-save">저장</button>
    </div>
  </form>
</dialog>

<!-- [팝업] 삭제 확인: "정말 삭제할까요?" -->
<dialog class="modal" id="delete-dialog" aria-labelledby="delete-title">
  <h2 id="delete-title">정말 삭제할까요?</h2>
  <p class="modal-meta" id="delete-meta"></p>
  <p class="msg-error form-error" id="delete-error" role="alert"></p>
  <div class="modal-actions">
    <button type="button" class="btn btn-ghost" id="delete-cancel" autofocus>취소</button>
    <button type="button" class="btn btn-danger" id="delete-confirm">삭제</button>
  </div>
</dialog>

<!-- 관리자 페이지 동작: 잠금 · 목록 · 수정 · 삭제 (모든 요청에 비밀번호를 함께 보내 서버가 매번 확인) -->
<script>
  (function () {
    var API = "/api/admin";
    var STORE_KEY = "hoseo-admin-password";
    var EMAIL_RULE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var FIELDS = ["name", "organization", "job_title", "phone", "email"];

    // 화면에 보이는 안내 문구 (한곳에 모아 둠)
    var MSG = {
      wrong: "비밀번호가 맞지 않습니다",
      noSecret: "서버에 관리자 비밀번호(ADMIN_PASSWORD)가 설정되지 않았어요.",
      offline: "서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.",
      empty: "아직 신청자가 없습니다.",
      name: "이름을 입력해 주세요.",
      phone: "연락처를 입력해 주세요.",
      email: "이메일을 입력해 주세요.",
      emailFormat: "이메일 형식이 올바르지 않아요.",
      duplicate: "다른 신청자가 이미 쓰는 이메일입니다.",
      failed: "저장하지 못했어요. 잠시 후 다시 시도해 주세요."
    };

    function $(id) { return document.getElementById(id); }
    var editDialog = $("edit-dialog");
    var deleteDialog = $("delete-dialog");
    var editForm = $("edit-form");
    var editing = null;   // 지금 고치는 신청자
    var deleting = null;  // 지금 지우려는 신청자

    // ── 비밀번호 보관: 이 브라우저 탭에만 (탭을 닫으면 사라짐) ──
    var memory = "";
    function getPassword() { try { return sessionStorage.getItem(STORE_KEY) || memory; } catch (e) { return memory; } }
    function setPassword(pw) { memory = pw; try { sessionStorage.setItem(STORE_KEY, pw); } catch (e) {} }
    function forgetPassword() { memory = ""; try { sessionStorage.removeItem(STORE_KEY); } catch (e) {} }

    // ── 서버에 요청 (매번 비밀번호를 함께 보냄) ──
    function api(method, id, body) {
      var options = { method: method, headers: { "X-Admin-Password": encodeURIComponent(getPassword()) } };
      if (body) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      return fetch(API + (id ? "?id=" + id : ""), options).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { status: res.status, body: data };
        });
      });
    }

    // 비밀번호가 틀렸거나(바뀌었거나) 서버에 비밀번호가 없으면 → 잠금 화면으로
    function lockMessage(r) {
      if (r.status === 401) return MSG.wrong;
      if (r.body && r.body.error === "no_secret") return MSG.noSecret;
      return "";
    }
    function lockIfNeeded(r) {
      var message = lockMessage(r);
      if (!message) return false;
      showLock(message);
      return true;
    }

    // ── [잠금 화면] ──
    function showLock(message) {
      forgetPassword();
      if (editDialog.open) editDialog.close();
      if (deleteDialog.open) deleteDialog.close();
      $("list-view").hidden = true;
      $("lock-view").hidden = false;
      $("lock-error").textContent = message || "";
      $("lock-submit").disabled = false;
      $("admin-password").value = "";
      $("admin-password").focus();
    }

    $("lock-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = $("admin-password").value;
      if (!pw) { $("admin-password").focus(); return; }
      setPassword(pw);
      $("lock-error").textContent = "";
      $("lock-submit").disabled = true;
      api("GET")
        .then(function (r) {
          if (r.status === 200 && r.body.ok) { showList(r.body); return; }
          showLock(lockMessage(r) || MSG.offline);
        })
        .catch(function () { showLock(MSG.offline); });
    });

    // ── [목록 화면] ──
    function cell(text, className) {
      var td = document.createElement("td");
      td.className = className;
      td.textContent = (text === null || text === undefined || text === "") ? "-" : text; // 글자로만 넣음 (코드로 실행되지 않게)
      return td;
    }
    function rowButton(label, className, onClick) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = className;
      b.textContent = label;
      b.addEventListener("click", onClick);
      return b;
    }

    function showList(data) {
      var list = data.applicants || [];
      $("total-count").textContent = data.total;
      $("list-error").textContent = "";
      var tbody = $("rows");
      tbody.textContent = "";
      if (!list.length) {
        var emptyRow = document.createElement("tr");
        var emptyCell = cell(MSG.empty, "empty");
        emptyCell.colSpan = 8;
        emptyRow.appendChild(emptyCell);
        tbody.appendChild(emptyRow);
      }
      list.forEach(function (a) {
        var tr = document.createElement("tr");
        tr.appendChild(cell(a.id, "num"));
        tr.appendChild(cell(a.created_at, "time"));
        tr.appendChild(cell(a.name, "name"));
        tr.appendChild(cell(a.organization, "org"));
        tr.appendChild(cell(a.job_title, "job"));
        tr.appendChild(cell(a.phone, "phone"));
        tr.appendChild(cell(a.email, "email"));
        var actions = document.createElement("td");
        actions.className = "actions";
        actions.appendChild(rowButton("수정", "btn-row", function () { openEdit(a); }));
        actions.appendChild(rowButton("삭제", "btn-row btn-row-danger", function () { openDelete(a); }));
        tr.appendChild(actions);
        tbody.appendChild(tr);
      });
      $("lock-view").hidden = true;
      $("list-view").hidden = false;
    }

    function refreshList() {
      return api("GET")
        .then(function (r) {
          if (lockIfNeeded(r)) return;
          if (r.status === 200 && r.body.ok) showList(r.body);
          else $("list-error").textContent = MSG.offline;
        })
        .catch(function () { $("list-error").textContent = MSG.offline; });
    }

    // ── [팝업] 수정 ──
    function setFieldError(field, text) {
      $("err-" + field).textContent = text;
      editForm.elements[field].setAttribute("aria-invalid", "true");
    }
    function clearEditErrors() {
      ["name", "phone", "email"].forEach(function (field) {
        $("err-" + field).textContent = "";
        editForm.elements[field].removeAttribute("aria-invalid");
      });
      $("edit-error").textContent = "";
    }

    function openEdit(a) {
      editing = a;
      clearEditErrors();
      FIELDS.forEach(function (field) { editForm.elements[field].value = a[field] || ""; });
      $("edit-meta").textContent = "신청 번호 " + a.id + " · " + a.created_at;
      $("edit-save").disabled = false;
      editDialog.showModal();
      editForm.elements.name.focus();
    }

    editForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!editing) return;
      clearEditErrors();
      var data = {};
      FIELDS.forEach(function (field) { data[field] = editForm.elements[field].value.trim(); });

      var firstWrong = null;
      if (!data.name) { setFieldError("name", MSG.name); firstWrong = firstWrong || "name"; }
      if (!data.phone) { setFieldError("phone", MSG.phone); firstWrong = firstWrong || "phone"; }
      if (!data.email) { setFieldError("email", MSG.email); firstWrong = firstWrong || "email"; }
      else if (!EMAIL_RULE.test(data.email)) { setFieldError("email", MSG.emailFormat); firstWrong = firstWrong || "email"; }
      if (firstWrong) { editForm.elements[firstWrong].focus(); return; }

      $("edit-save").disabled = true;
      api("PUT", editing.id, data)
        .then(function (r) {
          if (lockIfNeeded(r)) return;
          if (r.status === 200 && r.body.ok) { editDialog.close(); refreshList(); return; }
          if (r.status === 409) { setFieldError("email", MSG.duplicate); editForm.elements.email.focus(); return; }
          if (r.status === 400 && r.body.error === "required" && MSG[r.body.field]) { setFieldError(r.body.field, MSG[r.body.field]); return; }
          if (r.status === 400 && r.body.error === "email_format") { setFieldError("email", MSG.emailFormat); return; }
          $("edit-error").textContent = MSG.failed;
        })
        .catch(function () { $("edit-error").textContent = MSG.offline; })
        .then(function () { $("edit-save").disabled = false; });
    });
    $("edit-cancel").addEventListener("click", function () { editDialog.close(); });

    // ── [팝업] 삭제 확인 ──
    function openDelete(a) {
      deleting = a;
      $("delete-meta").textContent = "신청 번호 " + a.id + " · " + a.name + " · " + a.email;
      $("delete-error").textContent = "";
      $("delete-confirm").disabled = false;
      deleteDialog.showModal();
    }

    $("delete-confirm").addEventListener("click", function () {
      if (!deleting) return;
      $("delete-confirm").disabled = true;
      api("DELETE", deleting.id)
        .then(function (r) {
          if (lockIfNeeded(r)) return;
          // 404 = 이미 지워진 신청자 → 목록만 새로 고침
          if ((r.status === 200 && r.body.ok) || r.status === 404) { deleteDialog.close(); refreshList(); return; }
          $("delete-error").textContent = MSG.offline;
        })
        .catch(function () { $("delete-error").textContent = MSG.offline; })
        .then(function () { $("delete-confirm").disabled = false; });
    });
    $("delete-cancel").addEventListener("click", function () { deleteDialog.close(); });

    // ── 처음 열었을 때: 이 탭에서 이미 로그인했으면 바로 목록, 아니면 잠금 화면 ──
    if (getPassword()) {
      api("GET")
        .then(function (r) {
          if (r.status === 200 && r.body.ok) showList(r.body);
          else showLock(lockMessage(r) || MSG.offline);
        })
        .catch(function () { showLock(MSG.offline); });
    } else {
      $("admin-password").focus();
    }
  })();
</script>

</body>
</html>
